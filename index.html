<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romford Holidays - Office ERP & Booking Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- SheetJS & jsPDF for Excel/PDF exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --brand: #153A68;
      --brand-dark: #0D2646;
      --brand-light: #EBF3FC;
      --brand-border: #C8DCF2;
      --accent: #2563EB;
      --accent-soft: #EFF6FF;
      --bg: #F4F6F9;
      --card: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --border-dark: #CBD5E1;
      
      --success: #16A34A;
      --success-soft: #DCFCE7;
      --warning: #D97706;
      --warning-soft: #FEF3C7;
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      
      --conf: #6B3FA0;
      --conf-soft: #F5F0FB;
      --conf-line: #DCCDEF;
      --owed: #B54708;
      --owed-soft: #FEF0E6;

      --visa: #0D9488;
      --visa-soft: #CCFBF1;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    input, select, textarea, button {
      font-family: inherit;
      font-size: inherit;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    [hidden] { display: none !important; }

    /* UTILITY CLASSES */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-brand { background: var(--brand-light); color: var(--brand); }
    .badge-purple { background: var(--conf-soft); color: var(--conf); border: 1px solid var(--conf-line); }
    .badge-owed { background: var(--owed-soft); color: var(--owed); }
    .badge-visa { background: var(--visa-soft); color: var(--visa); }
    .badge-muted { background: #F1F5F9; color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-outline { background: #fff; border-color: var(--border-dark); color: var(--text); }
    .btn-outline:hover { background: #f8fafc; border-color: var(--brand); color: var(--brand); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: #fff; border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-soft); }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn-link { background: none; border: none; color: var(--brand); padding: 0; text-decoration: underline; cursor: pointer; }

    /* FORM STYLES */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(21, 58, 104, 0.12);
    }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .form-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .form-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    @media (max-width: 768px) {
      .form-grid-2, .form-grid-3, .form-grid-4, .form-grid-5 { grid-template-columns: 1fr; }
    }

    /* ACCORDION SECTIONS */
    .sec-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .sec-card.conf {
      background: #FCFAFF;
      border-color: var(--conf-line);
      box-shadow: inset 4px 0 0 var(--conf);
    }
    .sec-head {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .sec-card.conf .sec-head { background: #FCFAFF; border-bottom-color: var(--conf-line); }
    .sec-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sec-card.conf .sec-title { color: var(--conf); }
    .sec-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 10px;
    }
    .sec-toggle {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
    }
    .sec-body {
      padding: 18px 20px;
    }

    /* SERVICE SELECTOR GRID */
    .svc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .svc-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .svc-card:hover { border-color: var(--brand-border); background: var(--brand-light); }
    .svc-card.active {
      border-color: var(--brand);
      background: var(--brand-light);
      box-shadow: 0 0 0 1px var(--brand);
    }
    .svc-card b { font-size: 15px; color: var(--brand); }
    .svc-card small { color: var(--text-muted); font-size: 12px; }

    /* KPI STATS CARDS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }
    .stat-card.conf {
      background: var(--conf-soft);
      border-color: var(--conf-line);
    }
    .stat-card.conf span { color: var(--conf); }
    .stat-card.conf b { color: var(--conf); }
    .stat-card span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .stat-card b {
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
    }

    /* TABLES */
    .tbl-wrapper {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #F8FAFC;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13px;
    }
    tr:last-child td { border-bottom: none; }
    tr.rowlink { cursor: pointer; transition: background 0.1s; }
    tr.rowlink:hover td { background: var(--brand-light); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    /* LOGIN SCREEN */
    #login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, #EBF3FC, #F4F6F9 65%);
    }
    .login-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .login-logo-wrap {
      text-align: center;
    }
    .login-logo-wrap img {
      max-height: 64px;
      max-width: 220px;
      object-fit: contain;
    }
    .login-title {
      text-align: center;
      margin-top: 8px;
    }
    .login-title h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.5px;
    }
    .login-title p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .role-dropdown-group {
      background: var(--brand-light);
      border: 1.5px solid var(--brand-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .role-dropdown-group label {
      font-size: 11px;
      font-weight: 800;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .role-dropdown-group select {
      padding: 10px;
      font-weight: 700;
      border: 1.5px solid #A8C7EB;
      border-radius: 8px;
      background: #fff;
      color: var(--brand-dark);
      cursor: pointer;
    }

    /* MAIN APP SHELL */
    #app-shell {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }
    .navbar {
      background: #fff;
      border-bottom: 1.5px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .navbar-logo {
      height: 38px;
      max-width: 150px;
      object-fit: contain;
    }
    .role-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--brand-light);
      color: var(--brand);
      border: 1px solid var(--brand-border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .navbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      background: #F1F5F9;
      padding: 4px 12px 4px 6px;
      border-radius: 999px;
    }
    .user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* ROLE SWITCHER IN TOPBAR */
    .role-quick-switch {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-dark);
      background: #fff;
      font-weight: 600;
      font-size: 12px;
      color: var(--brand);
      cursor: pointer;
    }

    /* TABS */
    .tabbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 12px 16px;
      border: none;
      background: none;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--brand); }
    .tab-btn.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }
    .tab-count {
      background: var(--danger);
      color: #fff;
      border-radius: 999px;
      font-size: 10px;
      padding: 1px 6px;
      font-weight: 700;
    }

    /* CONTAINER */
    .main-wrap {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ACTION BAR */
    .actionbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .actionbar-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .actionbar-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* SWITCH / TOGGLES */
    .switch-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .switch-label:last-child { border-bottom: none; }
    .switch-text b { display: block; font-weight: 600; font-size: 13.5px; }
    .switch-text small { color: var(--text-muted); font-size: 12px; }
    .switch-inp {
      appearance: none;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #CBD5E1;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }
    .switch-inp::after {
      content: "";
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .switch-inp:checked { background: var(--brand); }
    .switch-inp:checked::after { left: 23px; }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1E293B;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 1000;
    }

    /* PRINT / EXPORT */
    @media print {
      .navbar, .tabbar, .actionbar-tools, .btn { display: none !important; }
      body { background: #fff; }
      .main-wrap { padding: 0; }
    }
  
    /* ENHANCED SALES & EMPLOYEE UI */
    .svc-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease !important;
    }
    .svc-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
      border-color: #0284C7 !important;
    }
    .form-control {
      transition: all 0.15s ease-in-out;
    }
    .form-control:focus {
      border-color: #0284C7 !important;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15) !important;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0f396b 0%, #0284C7 100%) !important;
      border: none !important;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .btn-primary:hover {
      opacity: 0.93;
      transform: translateY(-1px);
    }
        
  
    /* ========================================================
       TRENDING MODERN MINIMALISTIC UI (EASY & PRODUCTIVE)
       ======================================================== */
    :root {
      --brand: #0F2D59;
      --brand-dark: #0A1E3C;
      --brand-light: #F0F6FE;
      --brand-border: #BFDBFE;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --border-dark: #CBD5E1;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Modern Login Container */
    #login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 10% 20%, #EFF6FF 0%, #F8FAFC 90%);
    }
    .login-box {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 35px -8px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .role-dropdown-group {
      background: linear-gradient(135deg, #F0F6FE 0%, #EFF6FF 100%);
      border: 1.5px solid #BFDBFE;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
    }
    .role-dropdown-group label {
      font-size: 11.5px;
      font-weight: 800;
      color: #0369A1;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .role-dropdown-group select {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      border: 1.5px solid #93C5FD;
      border-radius: 10px;
      background: #FFFFFF;
      color: #0F172A;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.06);
    }
    .role-dropdown-group select:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    /* Modern Navbar */
    .navbar {
      background: #FFFFFF;
      border-bottom: 1.5px solid #E2E8F0;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .role-pill {
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .role-quick-switch {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      background: #F8FAFC;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-quick-switch:hover, .role-quick-switch:focus {
      border-color: #2563EB;
      background: #FFFFFF;
    }

    /* Clean Subnav Tabs */
    .tabbar {
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
      padding: 0 28px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 13px 18px;
      font-size: 13.5px;
      font-weight: 600;
      color: #64748B;
      border: none;
      background: transparent;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: #0F172A;
      background: #F8FAFC;
    }
    .tab-btn.active {
      color: #2563EB;
      border-bottom-color: #2563EB;
      font-weight: 700;
      background: #FAFCFF;
    }
    .tab-count {
      background: #EF4444;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* Modern KPI Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }
    .stat-card span {
      font-size: 12px;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .stat-card b {
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
    }

    /* Buttons with smooth gradients */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 100%) !important;
      color: #FFFFFF !important;
      border: none !important;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
      opacity: 0.95;
    }
    .btn-success {
      background: linear-gradient(135deg, #15803D 0%, #16A34A 100%) !important;
      color: #FFFFFF !important;
      border: none !important;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2);
    }
    .btn-success:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 14px rgba(22, 163, 74, 0.3);
      opacity: 0.95;
    }
    .btn-outline {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #334155;
    }
    .btn-outline:hover {
      border-color: #2563EB;
      color: #2563EB;
      background: #F8FAFC;
    }

    /* Cards & Tables */
    .sec-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .sec-head {
      padding: 16px 22px;
      background: #FAFCFF;
      border-bottom: 1px solid #E2E8F0;
    }
    .sec-title {
      font-size: 15px;
      font-weight: 700;
      color: #0F172A;
    }
    .tbl-wrapper {
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    thead th {
      background: #F8FAFC;
      color: #475569;
      font-weight: 700;
      padding: 12px 16px;
      border-bottom: 1px solid #E2E8F0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tbody tr {
      border-bottom: 1px solid #F1F5F9;
      transition: background 0.15s ease;
    }
    tbody tr:hover {
      background: #F8FAFC;
    }
    td {
      padding: 13px 16px;
      color: #1E293B;
      vertical-align: middle;
    }
    .form-control {
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13.5px;
      color: #0F172A;
      background: #FFFFFF;
      transition: all 0.15s ease;
    }
    .form-control:focus {
      border-color: #2563EB !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
      outline: none;
    }

    /* Remove number input up/down spinner buttons everywhere */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .ta-pop {
      position: fixed;
      z-index: 9999;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.18);

      overflow-y: auto;
      margin: 0;

      padding: 8px 12px;

    var __AIRPORTS = null;
    function airportIndex() {
      if (__AIRPORTS) return __AIRPORTS;
      var out = [];
      var parts = AIRPORT_DATA.split("\n");
      for (var i = 0; i < parts.length; i++) {
        var line = parts[i];
        if (!line) continue;
        var p = line.split("|");
        if (p.length < 3) continue;
        out.push({ code: p[0], city: p[1], country: p[2] });
      }
      __AIRPORTS = out;
      return out;
    }

    function _taLev(a, b) {
      var m = a.length, n = b.length;
      if (Math.abs(m - n) > 2) return 99;
      var prev = new Array(n + 1);
      for (var j = 0; j <= n; j++) prev[j] = j;
      for (var i = 1; i <= m; i++) {
        var cur = [i];
        for (var j2 = 1; j2 <= n; j2++) {
          var cost = a.charAt(i - 1) === b.charAt(j2 - 1) ? 0 : 1;
          cur[j2] = Math.min(prev[j2] + 1, cur[j2 - 1] + 1, prev[j2 - 1] + cost);
        }
        prev = cur;
      }
      return prev[n];
    }

    function airportSearch(q, limit) {
      limit = limit || 8;
      q = String(q || "").trim().toLowerCase();
      if (!q) return [];
      var all = airportIndex();
      var aliasCodes = {};
      for (var k in AIRPORT_ALIASES) {
        if (!AIRPORT_ALIASES.hasOwnProperty(k)) continue;
        if (k.indexOf(q) === 0 || q.indexOf(k) === 0) aliasCodes[AIRPORT_ALIASES[k]] = true;
      }
      var res = [];
      for (var i = 0; i < all.length; i++) {
        var a = all[i];
        var cityL = a.city.toLowerCase();
        var codeL = a.code.toLowerCase();
        var ctryL = a.country.toLowerCase();
        var score = -1;
        if (codeL === q) score = 0;
        else if (cityL === q) score = 1;
        else if (cityL.indexOf(q) === 0) score = 2;
        else if (cityL.indexOf(q) > -1) score = 3;
        else if (aliasCodes[a.code]) score = 4;
        else if (q.length >= 4 && _taLev(cityL, q) <= (q.length >= 6 ? 2 : 1)) score = 5;
        else if (codeL.indexOf(q) === 0) score = 6;
        else if (ctryL.indexOf(q) === 0) score = 7;
        else continue;
        if (AIRPORT_POPULAR[a.code]) score = score - 0.5;
        res.push({ a: a, score: score });
      }
      res.sort(function (x, y) {
        if (x.score !== y.score) return x.score - y.score;
        if (x.a.city.length !== y.a.city.length) return x.a.city.length - y.a.city.length;
        return x.a.city.localeCompare(y.a.city);
      });
      var out = [];
      for (var r = 0; r < res.length && out.length < limit; r++) out.push(res[r].a);
      return out;
    }

    function _taEsc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function _taBox() {
      var b = document.getElementById("__ta_box");
      if (!b) {
        b = document.createElement("div");

        document.body.appendChild(b);

    let airportHideTimer;
    function taShow(input) {
      clearTimeout(airportHideTimer);
      var box = _taBox();
      var q = String(input.value || "").trim();
      var list = airportSearch(q, 8);
      if (!q || !list.length) { box.style.display = "none"; box._list = []; return; }
      box._list = list;
      box._activeIndex = -1;
      box._inputId = input.id;
      var html = "";
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        html += '<div class="ta-item" onpointerdown="taPickIndex(' + i + ')">'
              + '<span class="ta-city">' + _taEsc(a.city) + '</span>'
              + '<span class="ta-code">' + a.code + '</span>'
              + '<span class="ta-ctry">' + _taEsc(a.country) + '</span></div>';
      }
      box.innerHTML = html;
      var r = input.getBoundingClientRect();
      box.style.left = r.left + "px";
      box.style.top = (r.bottom + 4) + "px";
      box.style.width = r.width + "px";
      box.style.display = "block";
      const viewportHeight=window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const below=viewportHeight-r.bottom-12;
      const above=r.top-12;
      const placeAbove=below<160 && above>below;
      box.style.maxHeight=Math.max(80,Math.min(280,placeAbove?above:below))+'px';
      box.style.top=(placeAbove?Math.max(8,r.top-box.offsetHeight-4):r.bottom+4)+'px';
    }

    function taKeydown(event) {
      const box=document.getElementById('__ta_box');
      if (!box || box.style.display==='none') return;
      if (event.key==='Escape') { taHide(); return; }
      if (event.key==='ArrowDown' || event.key==='ArrowUp') {
        event.preventDefault(); const n=box._list.length;
        box._activeIndex=box._activeIndex<0 ? (event.key==='ArrowDown'?0:n-1) : (box._activeIndex+(event.key==='ArrowDown'?1:-1)+n)%n;
        Array.from(box.children).forEach((el,i)=>{el.style.background=i===box._activeIndex?'#EBF3FC':'';});
      } else if(event.key==='Enter' && box._activeIndex>=0) {event.preventDefault();taPickIndex(box._activeIndex);}
    }
    function taPickIndex(idx) {
      var box = document.getElementById("__ta_box");
      var a = box && box._list ? box._list[idx] : null;
      if (!a) return;
      var el = document.getElementById(box._inputId);
      if (el) { el.value = a.city + " (" + a.code + ")"; el.focus(); el.dispatchEvent(new Event("input", {bubbles:true})); }
      box.style.display = "none";
      if (currentEditingFileId) __bookingDirty = true;

    function formatINR(val) {
      if (val === null || val === undefined || isNaN(val)) return "—";
      return "₹" + (+val).toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    // Robustly parse a receipt amount (handles numbers or strings like "₹50,000").
    function receiptAmt(r) {
      const n = parseFloat(String(r && r.amount != null ? r.amount : 0).replace(/[^0-9.]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    // Single source of truth for a booking's payment status (used in list + detail).
    function getPaymentStatus(f) {
      const sell = +f.sell || 0;
      const receipts = f.receipts || [];
      const recTotal = receipts.reduce((a, b) => a + receiptAmt(b), 0);
      if (sell <= 0) {
        if (recTotal > 0) return { label: 'Received ' + formatINR(recTotal), cls: 'badge-brand' };
        return { label: 'Unpaid', cls: 'badge-warning' };
      }
      if (recTotal >= sell) return { label: 'Paid in Full', cls: 'badge-success' };
      if (recTotal > 0) return { label: 'Partially Paid', cls: 'badge-brand' };
      return { label: 'Unpaid', cls: 'badge-warning' };
    }

        file,
        what,
        change,
        dmc: dmc || ""
      });
      saveData();
    }

    /* ========================================================
       AUTH & NAVIGATION
       ======================================================== */
    function handleLoginSubmit(event) { submitSignIn(event); }
    function enterOffice(user, recordLogin) {
      currentUsername=user.username; currentRole=user.role; currentUser=user.name || user.username;
      currentEditingFileId=null; sessionIsAdmin=user.role==='admin'; refreshFromStorage();
      if (recordLogin) {
        DB.loginLog.unshift({time:new Date().toLocaleString('en-IN'),user:currentUser,role:ROLES[user.role].label,ip:'Browser session'});
        saveData();
      }
      document.getElementById('login-page').style.display='none';
      document.getElementById('app-shell').style.display='flex';
      document.getElementById('nav-role-badge').textContent=ROLES[user.role].label;
      document.getElementById('nav-user-name').textContent=currentUser+' ('+ROLES[user.role].label+')';
      document.getElementById('avatar-circle').textContent=currentUser.charAt(0).toUpperCase();
      setRoleTabs(); updateApprovalNotice();
    }
    function handleLogout() {
      if (__bookingDirty && !confirm('Discard unsaved booking changes and sign out?')) return;
      endAuthSession(); currentUsername=null; currentEditingFileId=null; sessionIsAdmin=false; __bookingDirty=false;
      document.getElementById('main-content-view').innerHTML='';
      document.getElementById('app-shell').style.display='none';
      taHide();
      if(location.protocol!=='file:') { location.replace('signin.html'); return; }
      document.getElementById('login-page').style.display='flex'; initSignIn();
    }
    function quickSwitchRole() { alert('Department is selected only at sign-in.'); }

    function setRoleTabs(preserveTab) {
      const nav = document.getElementById('subnav-tabs'); nav.innerHTML = '';
      const tabs = allowedTabs();
      if (!(preserveTab && tabs.some(t=>t.id===activeTab))) activeTab = tabs[0]?.id || 'no_access';
      tabs.forEach(t=>{
        const b = document.createElement('button'); b.className = 'tab-btn'+(t.id===activeTab?' active':''); b.textContent=t.label;
        b.onclick=()=>{
          if (__bookingDirty && !confirm('Discard unsaved booking changes?')) return;
          __bookingDirty=false; activeTab=t.id; currentEditingFileId=null; setRoleTabs(true);
        }; nav.appendChild(b);
      }); renderMain();
    }

    function getTodayActionCount() {
      let count = 0;
      // 1. Unverified receipts
      visibleBookings().forEach(b => {
        b.receipts.forEach(r => { if (!r.verified) count++; });
      });
      // 2. Approved payments to pay
      count += visibleBookings().filter(b => b.opsApproved && !b.supplierPaid).length;
      // 3. Invoices to raise
      count += visibleBookings().filter(b => b.submitted && b.cost > 0 && !b.invoiceNo).length;
      return count;
    }

    /* ========================================================
       MAIN RENDER DISPATCHER
       ======================================================== */
    function renderMain() {
      if (!signedInUser()) return;
      if (!currentEditingFileId && !allowedTabs().some(t=>t.id===activeTab)) {
        document.getElementById('main-content-view').textContent='No access has been assigned to this page. Contact your administrator.'; return;
      }
      const container = document.getElementById("main-content-view");
      container.innerHTML = "";

      if (currentEditingFileId) {
        renderBookingDetailPage(container, currentEditingFileId);
        return;
      }

      if (activeTab === "bookings") {
        renderBookingsListPage(container);
      } else if (activeTab === "new_file") {
        renderNewFileCreation(container, "all");
      } else if (activeTab === "flight_bookings") {
        renderBookingsListPage(container, "flight");
      } else if (activeTab === "new_flight") {
        renderNewFileCreation(container, "flight");
      } else if (activeTab === "visa_bookings") {
        renderBookingsListPage(container, "visa");
      } else if (activeTab === "new_visa") {
        renderNewFileCreation(container, "visa");
      } else if (activeTab === "today") {
        renderTodayDashboard(container);
      } else if (activeTab === "supplier_pays") {
        renderSupplierPaymentsPage(container);
      } else if (activeTab === "cash") {
        renderCashBookPage(container);
      } else if (activeTab === "profit") {
        renderProfitMarkupPage(container);
      } else if (activeTab === "suppliers") {
        renderSuppliersPage(container);
      } else if (activeTab === "changelog") {
        renderChangeLogPage(container);
      } else if (activeTab === "rules") {
        renderAccessRulesPage(container);
      } else if (activeTab === "approvals") {
        renderLoginApprovals(container);
      } else if (activeTab === "security") {
        renderSecurityLogsPage(container);
      }
      applyPagePermissions(container);
    }

    /* ========================================================
       PAGE 1: BOOKINGS LIST (WITH METRICS & EXCEL/PDF EXPORTS)
       ======================================================== */
    function renderBookingsListPage(container, filterService = "all") {
      let files = visibleBookings();
      if (filterService !== "all") {
        files = files.filter(f => f.service === filterService);
      }

      // Metrics calculation
      const totalSold = files.reduce((acc, f) => acc + (+f.sell || 0), 0);
      const totalRecv = files.reduce((acc, f) => acc + (f.receipts || []).reduce((racc, r) => racc + receiptAmt(r), 0), 0);
      const toCollect = Math.max(0, totalSold - totalRecv);
      const totalCost = files.reduce((acc, f) => acc + (+f.cost || 0), 0);
      const totalMarkup = totalSold - totalCost;

      let statsHtml = `
        <div class="stats-row">
          <div class="stat-card">
            <span>Active Bookings</span>
            <b>${files.length}</b>
          </div>
          <div class="stat-card">
            <span>Total Sold</span>
            <b>${formatINR(totalSold)}</b>
          </div>
          <div class="stat-card">
            <span>To Collect (Balance)</span>
            <b style="color:var(--warning);">${formatINR(toCollect)}</b>
          </div>
          <div class="stat-card">
            <span>Received</span>
            <b style="color:var(--success);">${formatINR(totalRecv)}</b>
          </div>
          ${(can('seeCost') || can('seeMarkup')) ? `
          <div class="stat-card conf">
            <span>Total Markup</span>
            <b>${can("seeMarkup") ? formatINR(totalMarkup) : "Restricted"}</b>
          </div>` : ''}
        </div>
      `;

      let headerTitle = "All Client Bookings";
      if (currentRole === "sales") headerTitle = "Sales Bookings";
      if (filterService === "flight") headerTitle = "Flight & Group Fare Bookings";
      if (filterService === "visa") headerTitle = "Visa Consultancy Files";

      container.innerHTML = `
        ${statsHtml}
        <div class="actionbar">
          <div class="actionbar-title">
            ${headerTitle}
          </div>
          <div class="actionbar-tools">
            <input type="text" id="search-box" class="form-control" placeholder="Search client, mobile, ID..." style="width:250px;" oninput="filterBookingsTable(this.value)">
            <button class="btn btn-primary" onclick="startNewBookingFlow('${filterService}')">+ New Booking</button>
            <button class="btn btn-outline" onclick="exportBookingsExcel()">Export Excel</button>
            <button class="btn btn-outline" onclick="exportBookingsPDF()">Export PDF</button>
          </div>
        </div>

        <div class="tbl-wrapper">
          <table id="bookings-table">
            <thead>
              <tr>
                <th>Booking ID</th>
                <th>Client Name & Contact</th>
                <th>Service & Destination</th>
                <th>Travel Date</th>
                <th class="num">Client Price</th>
                <th class="num">Received</th>
                <th class="num">Balance</th>
                ${(can('seeCost') || can('seeMarkup')) ? '<th class="num" style="color:var(--conf);">Cost / Markup</th>' : ''}
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${renderBookingsTableRows(files)}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderBookingsTableRows(files) {
      if (!files.length) {
        return `<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--text-muted);">No booking records found. Click "+ New Booking" to create one.</td></tr>`;
      }
      return files.map(f => {
        const rec = (f.receipts || []).reduce((a, b) => a + receiptAmt(b), 0);
        const bal = Math.max(0, (+f.sell || 0) - rec);
        const mk = (+f.sell || 0) - (+f.cost || 0);

        let svcLabel = "Tour";
        if (f.service === "flight") svcLabel = "Flight (" + (f.fareType || "portal").toUpperCase() + ")";
        if (f.service === "hotel") svcLabel = "Hotel";
        if (f.service === "visa") svcLabel = "Visa";
        if (f.service === "other") svcLabel = "Other";

        let stBadge;
        if (!f.submitted) {
          stBadge = '<span class="badge badge-warning">Draft</span>';
        } else {
          const ps = getPaymentStatus(f);
          stBadge = '<span class="badge ' + ps.cls + '" style="font-weight:600;">' + ps.label + '</span>';
        }

        return `
          <tr class="rowlink" onclick="openBookingFile('${htmlEscape(f.id)}')">
            <td><strong class="mono" style="color:var(--brand);">${htmlEscape(f.id)}</strong><br><small class="badge badge-muted">${svcLabel}</small></td>
            <td><strong>${htmlEscape(f.client)}</strong><br><small class="mono text-muted">${htmlEscape(f.mobile)}</small></td>
            <td>${htmlEscape(f.dest || f.country || (f.from ? f.from + " ➔ " + f.to : "—"))}</td>
            <td>${htmlEscape(f.start || f.depart || f.appt || "—")}</td>
            <td class="num"><strong>${formatINR(f.sell)}</strong></td>
            <td class="num" style="color:var(--success); font-weight:600;">${formatINR(rec)}</td>
            <td class="num" style="color:${bal > 0 ? "var(--warning)" : "var(--text-muted)"}; font-weight:600;">${formatINR(bal)}</td>
            ${(can('seeCost') || can('seeMarkup')) ? `
            <td class="num" style="color:var(--conf); font-weight:700;">
              ${can("seeCost") ? formatINR(f.cost) : "Restricted"}<br><small style="color:var(--conf);">${can("seeMarkup") ? formatINR(mk) + " mk" : ""}</small>
            </td>` : ''}
            <td>${stBadge}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openBookingFile('${htmlEscape(f.id)}')">Open File ➔</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function filterBookingsTable(query) {
      const q = query.toLowerCase();
      const filtered = visibleBookings().filter(b => 
        b.id.toLowerCase().includes(q) ||
        (b.client && b.client.toLowerCase().includes(q)) ||
        (b.mobile && b.mobile.includes(q)) ||
        (b.dest && b.dest.toLowerCase().includes(q))
      );
      document.querySelector("#bookings-table tbody").innerHTML = renderBookingsTableRows(filtered);
    }

    function startNewBookingFlow(prefService) {
      if (!requirePermission('create')) return;
      if (prefService === "flight") {
        createNewBookingRecord("flight");
      } else if (prefService === "visa") {
        createNewBookingRecord("visa");
      } else {
        renderNewFileCreation(document.getElementById("main-content-view"), "all");
      }
    }

    function renderNewFileCreation(container, filterType) {
      if (!requirePermission('create')) return;
      container.innerHTML = `
        <div class="actionbar">
          <div class="actionbar-title">Start a New Booking File</div>
          <button class="btn btn-outline" onclick="currentEditingFileId=null; renderMain();">← Cancel & Back</button>
        </div>
        <div class="sec-card">
          <div class="sec-body">
            <h3 style="margin-bottom:16px; color:var(--brand);">Select the Service you are booking:</h3>
            <div class="svc-grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
              <div class="svc-card active" onclick="createNewBookingRecord('tour')" style="border-radius:14px; padding:22px; cursor:pointer; transition:all 0.2s ease; border: 2px solid #0284C7; background:#F0F9FF; box-shadow:0 4px 12px rgba(2,132,199,0.08);">
                <div style="font-size:28px; margin-bottom:8px;">🌴</div>
                <b style="font-size:18px; display:block; margin-bottom:6px; color:#0369A1;">Tour Package</b>
                <small style="color:#475569; font-size:13.5px; line-height:1.45; display:block;">Custom holiday packages with dedicated DMC & Net rate costing</small>
              </div>
              <div class="svc-card" onclick="createNewBookingRecord('flight')" style="border-radius:14px; padding:22px; cursor:pointer; transition:all 0.2s ease; border: 2px solid var(--border); background:#fff;">
                <div style="font-size:28px; margin-bottom:8px;">✈️</div>
                <b style="font-size:18px; display:block; margin-bottom:6px; color:var(--brand);">Flight Ticket</b>
                <small style="color:#475569; font-size:13.5px; line-height:1.45; display:block;">Portal fare or Group fare with instant PNR tracking (No DMC)</small>
              </div>
              <div class="svc-card" onclick="createNewBookingRecord('other')" style="border-radius:14px; padding:22px; cursor:pointer; transition:all 0.2s ease; border: 2px solid var(--border); background:#fff;">
                <div style="font-size:28px; margin-bottom:8px;">📑</div>
                <b style="font-size:18px; display:block; margin-bottom:6px; color:var(--brand);">Other Service</b>
                <small style="color:#475569; font-size:13.5px; line-height:1.45; display:block;">Travel insurance, transfers, forex, car rental & add-ons</small>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function createNewBookingRecord(svc) {
      if (!requirePermission('create') || !requirePermission('bookings')) return;
      refreshFromStorage();
      const year = new Date().getFullYear();
      const nextNum = String(Math.max(0, ...DB.bookings.map(b => Number(String(b.id).match(new RegExp('^RH-' + year + '-(\\d+)$'))?.[1]) || 0)) + 1).padStart(4, '0');
      const id = `RH-${year}-${nextNum}`;

      const newRec = {
        id,
        service: svc,
        client: "",
        mobile: "",
        address: "",
        dest: "",
        start: "",
        end: "",
        pax: 1,
        sell: 0,
        owner: currentUser,
        ownerUsername: currentUsername,
        submitted: false,
        salesKnows: false,
        dmcName: "",
        dmcNet: 0,
        cost: 0,
        costPending: true,
        opsApproved: false,
        supplierPaid: false,
        utr: "",
        invoiceNo: "",
        vyapar: false,
        receipts: [],
        schedule: []
      };

      if (svc === "flight") {
        newRec.tripType = "Return";
        newRec.fareType = (currentRole === "res" ? "group" : "portal");
        newRec.ticketStatus = "Not issued";
        newRec.from = "";
        newRec.to = "";
        newRec.depart = "";
        newRec.ret = "";
        newRec.airline = "";
        newRec.paxNames = "";
        newRec.pnr = "";
        newRec.ticketNo = "";
        newRec.issuedBy = "Booking staff";
        newRec.issueDate = "";
      } else if (svc === "hotel") {
        newRec.hotel = "";
        newRec.city = "";
        newRec.checkin = "";
        newRec.checkout = "";
        newRec.rooms = 1;
      } else if (svc === "visa") {
        newRec.country = "";
        newRec.visaType = "Tourist Visa";
        newRec.appt = "";
        newRec.visaStatus = "Document Collection";
        newRec.docsChecked = false;
      } else if (svc === "other") {
        newRec.what = "";
        newRec.date = "";
        newRec.ourPrice = 0;
      }

      DB.bookings.unshift(newRec);
      addLog(currentUser, ROLES[currentRole].label, id, "Draft created", svc.toUpperCase());
      saveData();
      openBookingFile(id);
    }

    function openBookingFile(id) {
      if (!requireBooking(id)) return;
      currentEditingFileId = id;
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ========================================================
       PAGE 2: COMPREHENSIVE BOOKING FILE VIEW & EDIT
       ======================================================== */
    let __bookingDirty = false;

    function renderBookingDetailPage(container, fileId) {
      if (!requireBooking(fileId)) return;
      const f = DB.bookings.find(b => b.id === fileId);

        container.innerHTML = `<div class="sec-card"><div class="sec-body">Booking not found. <button class="btn btn-outline" onclick="currentEditingFileId=null;renderMain();">Back</button></div></div>`;
        return;

      const recVerified = (f.receipts || []).reduce((a, b) => a + (b.verified ? receiptAmt(b) : 0), 0);

          <div class="stat-card conf">

    /* ========================================================
       CUSTOMER DOCUMENT AUTO-FILL (PDF / TEXT) - Flight documents
       ======================================================== */
    let __docAutoFillTargetFileId = null;
    let docImportSequence = 0;

    function triggerCustomerDocImport(fileId) {
      if (!requireBooking(fileId) || !canEditDetails(DB.bookings.find(b=>b.id===fileId))) return;
      __docAutoFillTargetFileId = fileId;
      const el = document.getElementById('bf-doc-upload');
      if (el) { el.value = ''; el.click(); }
    }

    async function handleCustomerDocUpload(input) {
      const file = input && input.files && input.files[0];
      if (!file) return;
      const importSequence = ++docImportSequence;
      const targetFileId = __docAutoFillTargetFileId;
      const targetForm = document.getElementById('bf-doc-upload');
      if (file.size > 20 * 1024 * 1024) { alert('Please upload a document smaller than 20 MB.'); return; }
      const status = document.getElementById('bf-doc-import-status');
      const setStatus = (msg, isErr) => {
        if (importSequence !== docImportSequence || targetForm !== document.getElementById('bf-doc-upload')) return;
        if (!status) return;
        status.textContent = msg;
        status.style.color = isErr ? 'var(--danger, #DC2626)' : 'var(--success, #16A34A)';
      };
      setStatus('Reading document...', false);
      try {
        let text = '';
        const name = (file.name || '').toLowerCase();
        if (file.type === 'application/pdf' || name.endsWith('.pdf')) {
          text = await extractTextFromPdfFile(file);
        } else if (name.endsWith('.txt') || file.type === 'text/plain') {
          text = await readFileAsText(file);
        } else {
          throw new Error('Please upload a PDF or TXT document.');
        }
        text = (text || '').replace(/\r/g, '');
        if (!text.trim()) {
          setStatus('No readable text found — this PDF may be a scanned image or password-protected. Please upload a text-based e-ticket PDF, or fill the details manually.', true);
          return;
        }
        if (importSequence !== docImportSequence || currentEditingFileId !== targetFileId || targetForm !== document.getElementById('bf-doc-upload')) return;
        const parsed = parseCustomerDetailsFromText(text);
        try { showDocDebug(text, parsed); } catch (e) {}
        const applied = applyParsedCustomerDetails(parsed, targetFileId);
        if (applied.length) {
          setStatus('Auto-filled: ' + applied.join(', ') + '. Please review all details before saving.', false);
          showToast('Flight details auto-filled from document');
        } else {
          setStatus('Document read, but no confident matches found. Please fill details manually.', true);
        }
      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Could not read this document. Try a text-based PDF/TXT or fill manually.', true);
      }
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }





    function showDocDebug(rawText, parsed) {
      const box = document.getElementById('bf-doc-debug');
      if (!box) return;
      const rawEl = document.getElementById('bf-doc-rawtext');
      const detEl = document.getElementById('bf-doc-detected');
      if (rawEl) rawEl.value = String(rawText || '').slice(0, 12000);
      if (detEl) {
        const summary = {
          passengers: parsed.passengers,
          paxCount: parsed.paxCount,
          tripType: parsed.tripType,
          airline: parsed.airline,
          from: parsed.from,
          to: parsed.to,
          depart: parsed.depart,
          ret: parsed.ret,
          pnr: parsed.pnr,
          ticketNo: parsed.ticketNo,
          payment: parsed.payment
        };
        detEl.value = JSON.stringify(summary, null, 2);
      }
      box.style.display = 'block';
      box.open = true;
    }





    function onFlightTripTypeChange(val) {
      const wrap = document.getElementById('bf-ret-wrap');
      const ret = document.getElementById('bf-ret');
      if (wrap) wrap.style.display = (val === 'One way') ? 'none' : '';
      if (val === 'One way' && ret) ret.value = '';
      try {
        const paxEl = document.getElementById('bf-pax');
        if (paxEl) {
          const cur = +paxEl.value || 0;
          if (!cur || cur < 1) paxEl.value = '1';
        }
        const hidden = document.getElementById('bf-paxnames');
        if (hidden) {
          const rows = collectPassengerRows();
          hidden.value = rows.length ? rows.join('|') : (hidden.value || '');
        }
      } catch (e) {}
    }

    function renderPassengerNameRows(f) {
      let list = [];
      if (f && Array.isArray(f.passengers)) list = f.passengers.slice();
      else if (f && f.paxNames) {
        list = String(f.paxNames).split(/\s*(?:\||;|\n)\s*/).map(s => s.trim()).filter(Boolean);
      }
      const paxN = (f && +f.pax > 0 ? +f.pax : 1);
      const count = Math.max(1, Math.max(paxN, list.length || 1));
      const finalList = list.slice(0, count);
      while (finalList.length < count) finalList.push('');
      let html = '';
      for (let i = 0; i < count; i++) {
        const name = htmlEscape(finalList[i] || '');
        html += `
          <div class="bf-pax-row" style="display:flex; gap:8px; align-items:center;">
            <span class="mono" style="min-width:22px; color:var(--muted); font-size:12px;">${i + 1}.</span>
            <input type="text" class="form-control bf-pax-name" data-index="${i}" value="${name}" placeholder="Passenger ${i + 1} full name as on ticket/passport">
            <button type="button" class="btn btn-outline btn-sm" onclick="removePassengerRow(${i})" title="Remove passenger" style="color:var(--danger, #DC2626);">x</button>
          </div>`;
      }
      return html;
    }

    function refreshPassengerRowsFromRecord(fileId) {
      const f = DB.bookings.find(b => b.id === fileId);
      if (!f) return;
      const wrap = document.getElementById('bf-paxnames-list');
      if (!wrap) return;
      wrap.innerHTML = renderPassengerNameRows(f);
      const hidden = document.getElementById('bf-paxnames');
      if (hidden) {
        const rows = collectPassengerRows();
        hidden.value = rows.length ? rows.join('|') : (f.paxNames || '');
      }

    function collectPassengerRows() {
      return Array.from(document.querySelectorAll('.bf-pax-name')).map(el => String(el.value || '').trim()).filter(Boolean);
    }

    function addPassengerRow(name) {
      __bookingDirty = true;
      const wrap = document.getElementById('bf-paxnames-list');
      if (!wrap) return;
      const idx = wrap.querySelectorAll('.bf-pax-row').length;
      const row = document.createElement('div');
      row.className = 'bf-pax-row';
      row.style.cssText = 'display:flex; gap:8px; align-items:center;';
      row.innerHTML = `
        <span class="mono" style="min-width:22px; color:var(--muted); font-size:12px;">${idx + 1}.</span>
        <input type="text" class="form-control bf-pax-name" data-index="${idx}" value="${htmlEscape(name || '')}" placeholder="Passenger ${idx + 1} full name as on ticket/passport">
        <button type="button" class="btn btn-outline btn-sm" onclick="removePassengerRow(${idx})" title="Remove passenger" style="color:var(--danger, #DC2626);">x</button>`;
      wrap.appendChild(row);

    function buildBookingLogDetail(f) {
      const _svcLabel = (f.service === "tour" ? "Tour" : f.service === "flight" ? "Flight" : f.service === "hotel" ? "Hotel" : f.service === "visa" ? "Visa" : "Other Service");
      const _dmcPart = (f.service === "tour" && f.salesKnows && f.dmcName) ? ("DMC: " + f.dmcName + (f.dmcNet ? (" · Net: " + formatINR(f.dmcNet)) : "")) : "";
      const _dmcCol = (f.service === "tour" && f.salesKnows && f.dmcName) ? (f.dmcName + (f.dmcNet ? (" · " + formatINR(f.dmcNet)) : "")) : "";
      const _detail = [f.client, _svcLabel, (f.service === "other" ? f.what : ""), (f.service === "tour" ? f.dest : ""), (f.service === "flight" ? ((f.from||"") + (f.to ? ("-"+f.to) : "")) : ""), _dmcPart].filter(Boolean).join(" · ");
      return { detail: _detail, dmc: _dmcCol };
    }

    function commitPendingPayment(f) {
      if (!can('receipts')) return false;
      const amtEl = document.getElementById("new-pay-amt");
      const amt = amtEl ? (+amtEl.value || 0) : 0;
      if (!Number.isFinite(amt) || amt <= 0) return false;
      const dateEl = document.getElementById("new-pay-date");
      const modeEl = document.getElementById("new-pay-mode");
      const refEl = document.getElementById("new-pay-ref");
      const byEl = document.getElementById("new-pay-by");
      const date = dateEl ? dateEl.value : localDate();
      if (!date) { alert("Enter the payment date before recording a receipt."); return false; }
      const mode = modeEl ? modeEl.value : "Cash";
      const ref = refEl ? refEl.value.trim() : "";
      const collectedBy = (byEl ? byEl.value.trim() : "") || currentUser;
      f.receipts.push({ date, amount: amt, mode, ref, by: collectedBy, verified: can("verify") });
      addLog(currentUser, ROLES[currentRole].label, f.id, "Client payment added", `${formatINR(amt)} - ${mode}${ref ? (" - " + ref) : ""} (Collected by: ${collectedBy})`);
      return true;
    }

    function validateBooking(f) {
      const missing = [];
      if (!String(f.client || '').trim()) missing.push('Client Name');
      let digits = String(f.mobile || '').replace(/\D/g, '');
      if (digits.length === 12 && digits.indexOf('91') === 0) digits = digits.slice(2);
      if (digits.length !== 10) missing.push('Mobile Number (10 digits)');
      if (f.service === 'flight') {
        if (!String(f.from || '').trim()) missing.push('From');
        if (!String(f.to || '').trim()) missing.push('To');
        if (!f.depart) missing.push('Departure Date');
        if (f.from && f.to && f.from.trim().toLowerCase()===f.to.trim().toLowerCase()) missing.push('Different origin and destination');
        if (f.tripType==='Return' && !f.ret) missing.push('Return Date');
        if (f.ret && f.depart && f.ret<f.depart) missing.push('Return date must be on or after departure');
      } else if (f.service === 'tour') {
        if (!String(f.dest || '').trim()) missing.push('Destination');
      } else if (f.service === 'hotel') {
        if (!String(f.hotel || '').trim()) missing.push('Hotel Name');
        if (!String(f.city || '').trim()) missing.push('City');
      } else if (f.service === 'visa') {
        if (!String(f.country || '').trim()) missing.push('Country');
      } else if (f.service === 'other') {
        if (!String(f.what || '').trim()) missing.push('Service Description');
      }
      if (!(+f.sell > 0)) missing.push('Client Selling Price');
      return missing;
    }

    function commitBooking(fileId) {
      if (!requireBooking(fileId) || !canSaveBooking(DB.bookings.find(b=>b.id===fileId))) return {ok:false};
      const latest = loadData().bookings.find(b=>b.id===fileId);
      if (bookingSnapshot && JSON.stringify(latest)!==bookingSnapshot) {
        alert('This booking changed in another tab. Copy your unsaved details, then reopen the booking before saving.'); return {ok:false};
      }
      refreshFromStorage();
      const f = DB.bookings.find(b => b.id === fileId);
      if (!f) return { ok: false };
      const check = JSON.parse(JSON.stringify(f));
      saveFormValuesToRecord(check);
      const missing = validateBooking(check);
      if (f.submitted && missing.some(item => !validateBooking(f).includes(item))) { alert('Please correct: '+missing.join(', ')); return {ok:false}; }
      saveFormValuesToRecord(f);
      const paid = commitPendingPayment(f);
      const wasSubmitted = !!f.submitted;
      let submitted = false;
      if (!wasSubmitted && canEditDetails(f) && missing.length === 0) {
        f.submitted = true;
        submitted = true;
      }
      const L = buildBookingLogDetail(f);
      if (submitted) {
        addLog(currentUser, ROLES[currentRole].label, f.id, "Booking submitted", (f.service || '').toUpperCase() + " · " + L.detail, L.dmc);
      } else {
        addLog(currentUser, ROLES[currentRole].label, f.id, "Booking details updated", L.detail, L.dmc);
      }
      if (!saveData()) return {ok:false};
      __bookingDirty = false;
      return { ok: true, paid, wasSubmitted, submitted, missing };
    }

    function saveBookingChanges(fileId) {
      const res = commitBooking(fileId);
      if (!res.ok) return;
      renderMain();
      if (res.submitted) {
        showToast(res.paid ? "Payment recorded. Booking submitted!" : "Booking Submitted! All changes saved.");
      } else if (!res.wasSubmitted && res.missing && res.missing.length) {
        alert('⚠️ Saved as draft. Please fill the required fields to submit:\n\n• ' + res.missing.join('\n• '));
      } else {
        showToast(res.paid ? "Payment recorded. All changes saved!" : "All Changes Saved!");
      }
    }

    function saveFormValuesToRecord(f) {
      if (!f || !canViewBooking(f)) return;
      const before = JSON.parse(JSON.stringify(f));
      const val = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
      const txt = (id) => { const v = val(id); return v == null ? undefined : String(v).trim(); };
      const has = (id) => !!document.getElementById(id);

      if (has("bf-client")) f.client = txt("bf-client") || "";
      if (has("bf-mobile")) f.mobile = txt("bf-mobile") || "";
      if (has("bf-address")) f.address = txt("bf-address") || "";
      if (has("bf-sell")) f.sell = Math.max(0, +val("bf-sell") || 0);

      if (f.service === "tour") {
        if (has("bf-dest")) f.dest = txt("bf-dest") || "";
        if (has("bf-start")) f.start = val("bf-start") || "";
        if (has("bf-end")) f.end = val("bf-end") || "";
        if (has("bf-pax")) f.pax = Math.max(1, +val("bf-pax") || 1);
      } else if (f.service === "flight") {
        if (has("bf-from")) f.from = txt("bf-from") || "";
        if (has("bf-to")) f.to = txt("bf-to") || "";
        if (has("bf-depart")) f.depart = val("bf-depart") || "";
        if (has("bf-airline")) f.airline = txt("bf-airline") || "";
        if (has("bf-pax")) f.pax = Math.max(1, +val("bf-pax") || 1);
        if (has("bf-triptype")) f.tripType = val("bf-triptype") || "Return";

        const paxList = collectPassengerRows();
        if (has("bf-paxnames-list")) {
          f.passengers = paxList;
          f.paxNames = paxList.join(" | ");
          f.client = paxList[0] || "";
          if (has("bf-client")) document.getElementById("bf-client").value = f.client;
        } else if (has("bf-paxnames")) {
          f.paxNames = txt("bf-paxnames") || "";
        }

        if (has("bf-ticketno")) f.ticketNo = txt("bf-ticketno") || "";
        if (has("bf-pnr")) f.pnr = txt("bf-pnr") || "";
        if (has("bf-faretype")) f.fareType = val("bf-faretype") || f.fareType || "portal";
        if (has("bf-ticketstatus")) {
          f.ticketStatus = val("bf-ticketstatus") || f.ticketStatus || "Not issued";
          if (f.ticketStatus === "Issued" && !f.issueDate) f.issueDate = localDate();
        }
        if (f.tripType === "One way") {
          f.ret = "";
          if (has("bf-ret")) document.getElementById("bf-ret").value = "";
        } else if (has("bf-ret")) {
          f.ret = val("bf-ret") || "";
        }
      } else if (f.service === "hotel") {
        if (has("bf-hotel")) f.hotel = txt("bf-hotel") || "";
        if (has("bf-city")) f.city = txt("bf-city") || "";
        if (has("bf-checkin")) f.checkin = val("bf-checkin") || "";
        if (has("bf-checkout")) f.checkout = val("bf-checkout") || "";
        if (has("bf-rooms")) f.rooms = Math.max(1, +val("bf-rooms") || 1);
        if (has("bf-pax")) f.pax = Math.max(1, +val("bf-pax") || 1);
      } else if (f.service === "visa") {
        if (has("bf-country")) f.country = txt("bf-country") || "";
        if (has("bf-visatype")) f.visaType = txt("bf-visatype") || "";
        if (has("bf-pax")) f.pax = Math.max(1, +val("bf-pax") || 1);
        if (has("bf-appt")) f.appt = val("bf-appt") || "";
      } else if (f.service === "other") {
        if (has("bf-what")) f.what = txt("bf-what") || "";
        if (has("bf-date")) f.date = val("bf-date") || "";
        if (has("bf-pax")) f.pax = Math.max(1, +val("bf-pax") || 1);
        if (has("bf-ourprice")) {
          f.ourPrice = Math.max(0, +val("bf-ourprice") || 0);
          f.cost = f.ourPrice;
          f.costPending = false;
        }
      }

      // DMC checkbox & inputs (tour packages)
      const sKnows = document.getElementById("bf-salesknows");
      if (sKnows) {
        f.salesKnows = sKnows.checked;
        if (f.salesKnows) {
          if (has("bf-dmcname")) f.dmcName = txt("bf-dmcname") || "";
          if (has("bf-dmcnet")) f.dmcNet = Math.max(0, +val("bf-dmcnet") || 0);
          f.cost = f.dmcNet;
          f.costPending = false;
        } else {
          f.dmcName = "";
          f.dmcNet = 0;
          f.cost = 0;
          f.costPending = true;
        }
      }
      const restore = keys => keys.forEach(k=>{ if (Object.prototype.hasOwnProperty.call(before,k)) f[k]=before[k]; else delete f[k]; });
      if (!canEditDetails(before)) restore(['client','mobile','address','dest','start','end','pax','from','to','depart','ret','airline','tripType','passengers','paxNames','hotel','city','checkin','checkout','rooms','country','visaType','appt','what','date']);
      if (!canEditPrice(before)) restore(['sell']);
      if (!can('costing')) restore(['salesKnows','dmcName','dmcNet','cost','costPending','ourPrice','supplier']);
      if (!can('ticketing')) restore(['ticketNo','pnr','fareType','ticketStatus','issueDate']);
      if (can('invoice')) {
        if (has('bf-inv')) f.invoiceNo=txt('bf-inv');
        if (has('bf-vyapar')) f.vyapar=document.getElementById('bf-vyapar').checked;
      }
      if (can('visa')) {
        if (has('bf-visastatus')) f.visaStatus=val('bf-visastatus');
        if (has('bf-vfsdate')) f.appt=val('bf-vfsdate');
        if (has('bf-docs')) f.docsChecked=document.getElementById('bf-docs').checked;
      }
      if (can('costing') && f.service==='flight') {
        if (has('bf-flightcost')) f.cost=Math.max(0,+val('bf-flightcost')||0);
        if (has('bf-supplier')) f.supplier=txt('bf-supplier');
        f.costPending=!(f.cost>0);
      }
      if (f.cost!==before.cost || f.dmcName!==before.dmcName || f.supplier!==before.supplier) {
        if (before.supplierPaid) { restore(['cost','dmcNet','dmcName','supplier','ourPrice','salesKnows','costPending']); alert('Supplier cost is locked after payout.'); }
        else f.opsApproved=false;
      }
    }

    function recordSupplierPayout(fileId) {
      const record=loadData().bookings.find(b=>b.id===fileId);
      if (!record?.opsApproved || record.supplierPaid || !(record.cost>0)) { alert('Only an approved, unpaid supplier amount can be paid.'); return; }
      if (!requireBooking(fileId, 'payout')) return;
      refreshFromStorage();
      const b = DB.bookings.find(x => x.id === fileId);
      const utr = prompt(`Enter Payment Reference / UTR for ${htmlEscape(b.dmcName || "Supplier")} (${can("seeCost") ? formatINR(b.cost) : "Restricted"}):`);
      if (!utr) return;
      b.supplierPaid = true;
      b.paidDate = localDate();
      b.utr = utr;
      addLog(currentUser, ROLES[currentRole].label, b.id, "Supplier paid", `UTR: ${utr}`);
      saveData();
      renderMain();
      showToast("Supplier payment recorded!");
    }

    function saveTodayInvoice(fileId) {
      if (!requireBooking(fileId, 'invoice')) return;
      const b = DB.bookings.find(x => x.id === fileId);
      const inv = document.getElementById("today-inv-" + fileId).value.trim();
      const vy = document.getElementById("today-vy-" + fileId).checked;
      if (!inv) {
        alert("Please enter invoice number.");
        return;
      }
      b.invoiceNo = inv;
      b.vyapar = vy;
      addLog(currentUser, ROLES[currentRole].label, b.id, "Invoice raised", `${inv} ${vy ? "(In Vyapar)" : ""}`);
      saveData();
      renderMain();
      showToast("Invoice saved for " + b.id);
    }

    function renderCashBookPage(container) {
      if (!requirePermission('cash')) return;
      let cashIn = 0;
      let cashOut = 0;
      const transactions = [];

      visibleBookings().forEach(b => {
        // Client inflows
        b.receipts.forEach(r => {
          if (r.verified) {
            cashIn += +r.amount;
            transactions.push({
              date: r.date,
              type: "in",
              booking: b.id,
              party: b.client,
              amount: +r.amount,
              mode: r.mode,
              ref: r.ref,
              status: "Verified Inflow"
            });
          }
        });

        // Supplier payouts
        if (b.supplierPaid) {
          cashOut += +b.cost;
          transactions.push({
            date: b.paidDate || "",
            type: "out",
            booking: b.id,
            party: b.dmcName || b.supplier || "Supplier",
            amount: +b.cost,
            mode: "Bank Transfer",
            ref: b.utr,
            status: "Completed Payout"
          });
        }
      });

      // Sort by date descending
      transactions.sort((a, b) => b.date.localeCompare(a.date));

      container.innerHTML = `
        <div class="stats-row">
          <div class="stat-card">
            <span>Total Money In (Receipts)</span>
            <b style="color:var(--success);">${formatINR(cashIn)}</b>

          <div class="stat-card">
            <span>Total Money Out (Payments)</span>

                  <td><strong>${htmlEscape(t.party)}</strong></td>

                  <td>${htmlEscape(t.mode)}</td>

            </tbody>
          </table>
        </div>
      `;

    function renderProfitMarkupPage(container) {
      if (!requirePermission('seeMarkup')) return;
      const submittedFiles = visibleBookings().filter(b => b.submitted);
      const totalSold = submittedFiles.reduce((acc, f) => acc + (+f.sell || 0), 0);
      const totalCost = submittedFiles.reduce((acc, f) => acc + (+f.cost || 0), 0);
      const totalMarkup = totalSold - totalCost;
      const avgMarkupPct = totalSold > 0 ? ((totalMarkup / totalSold) * 100).toFixed(1) : "0.0";

      // Group markup by service
      const byService = {};
      submittedFiles.forEach(f => {
        const s = f.service;
        if (!byService[s]) byService[s] = { count: 0, sell: 0, cost: 0, mk: 0 };
        byService[s].count++;
        byService[s].sell += (+f.sell || 0);
        byService[s].cost += (+f.cost || 0);
        byService[s].mk += ((+f.sell || 0) - (+f.cost || 0));
      });

      container.innerHTML = `
        <div class="sec-card conf">
          <div class="sec-body" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
              <h2 style="font-size:18px; font-weight:800; color:var(--conf);">📊 Profit & Margin Executive Dashboard</h2>
              <p style="color:var(--text-muted); font-size:12px;">Confidential financial view visible only to Accounts and Super Admin.</p>
            </div>
            <span class="badge badge-purple" style="font-size:12px; padding:5px 12px;">CONFIDENTIAL</span>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card conf">
            <span>Total Sold (Sales)</span>
            <b>${formatINR(totalSold)}</b>
          </div>
          <div class="stat-card conf">
            <span>Supplier Direct Cost</span>
            <b>${formatINR(totalCost)}</b>
          </div>
          <div class="stat-card conf">
            <span>Total Gross Profit (Markup)</span>
            <b style="color:var(--conf); font-size:26px;">${formatINR(totalMarkup)}</b>
          </div>
          <div class="stat-card conf">
            <span>Average Margin %</span>
            <b>${avgMarkupPct}%</b>
          </div>
        </div>

        <!-- SERVICE PROFITABILITY BREAKDOWN -->
        <div class="sec-card">
          <div class="sec-head">
            <div class="sec-title">📈 Profitability by Service Category</div>
          </div>
          <div class="sec-body">
            <div class="tbl-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Service</th>
                    <th>Files</th>
                    <th class="num">Revenue (Sold)</th>
                    <th class="num">Supplier Cost</th>
                    <th class="num" style="color:var(--conf);">Markup Profit</th>
                    <th class="num">Margin %</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(byService).map(([svc, d]) => `
                    <tr>
                      <td><strong style="text-transform:uppercase;">${svc}</strong></td>
                      <td>${d.count}</td>
                      <td class="num">${formatINR(d.sell)}</td>
                      <td class="num">${formatINR(d.cost)}</td>
                      <td class="num font-weight-bold" style="color:var(--conf);">${formatINR(d.mk)}</td>
                      <td class="num">${d.sell > 0 ? ((d.mk / d.sell) * 100).toFixed(1) + "%" : "—"}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
