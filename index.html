    /* ========================================================
       EXPORTS: EXCEL & PDF UTILITIES
       ======================================================== */
    function exportBookingsExcel() {
      if (!requirePermission('export') || !requirePermission('bookings')) return;
      if (typeof XLSX === "undefined") {
        alert("Export tool loading... please try again in a moment.");
        return;
      }
      const data = visibleBookings().map(b => ({
        "Booking ID": b.id,
        "Client Name": b.client,
        "Mobile": b.mobile,
        "Service": b.service.toUpperCase(),
        "Trip": b.dest || b.country || (b.from ? b.from + " - " + b.to : ""),
        "Selling Price": b.sell,
        ...(can("seeCost") ? {"Supplier Cost": b.cost} : {}),
        ...(can("seeMarkup") ? {"Markup": b.sell - b.cost} : {}),
        "Invoice No": b.invoiceNo || "Pending",
        "Submitted": b.submitted ? "Yes" : "Draft"
      }));

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Bookings");
      XLSX.writeFile(wb, `Romford_Bookings_${localDate()}.xlsx`);
      showToast("Excel Export Downloaded!");
    }

    function exportBookingsPDF() {
      if (!requirePermission('export') || !requirePermission('bookings')) return;
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF generator loading... please try again.");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape" });

      doc.setFontSize(16);
      doc.setTextColor(21, 58, 104);
      doc.text("ROMFORD HOLIDAYS - BOOKINGS REPORT", 14, 18);
      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text(`Generated on ${new Date().toLocaleDateString("en-IN")} by ${currentUser}`, 14, 25);

      const headers = [["ID", "Client", "Mobile", "Service", "Trip", "Price", "Cost", "Markup", "Status"]];
      const rows = visibleBookings().map(b => [
        b.id,
        b.client,
        b.mobile,
        b.service.toUpperCase(),
        b.dest || b.country || (b.from ? b.from + "-" + b.to : ""),
        formatINR(b.sell),
        can("seeCost") ? formatINR(b.cost) : "Restricted",
        can("seeMarkup") ? formatINR(b.sell - b.cost) : "Restricted",
        b.submitted ? "Submitted" : "Draft"
      ]);

      doc.autoTable({
        head: headers,
        body: rows,
        startY: 32,
        theme: "grid",
        headStyles: { fillColor: [21, 58, 104] }
      });

      doc.save(`Romford_Bookings_${localDate()}.pdf`);
      showToast("PDF Export Downloaded!");
    }

    function exportCashBookExcel() {
      if (!requirePermission('export') || !requirePermission('cash')) return;
      showToast("Exporting Cash Book to Excel...");
      if (typeof XLSX === "undefined") return;
      const data = [];
      visibleBookings().forEach(b => {
        b.receipts.forEach(r => {
          if (r.verified) {
            data.push({
              "Date": r.date,
              "Type": "Money In (Receipt)",
              "Booking ID": b.id,
              "Party": b.client,
              "Amount": r.amount,
              "Mode": r.mode,
              "Ref": r.ref
            });
          }
        });
        if (b.supplierPaid) {
          data.push({
            "Date": b.paidDate || "",
            "Type": "Money Out (Payout)",
            "Booking ID": b.id,
            "Party": b.dmcName || b.supplier || "Supplier",
            "Amount": b.cost,
            "Mode": "Bank Transfer",
            "Ref": b.utr
          });
        }
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "CashBook");
      XLSX.writeFile(wb, `Romford_CashBook_${localDate()}.xlsx`);
    }

    function exportSupplierPaymentsExcel() {
      if (!requirePermission('export') || !requirePermission('supplierPayments')) return;
      showToast("Exporting Supplier Payments to Excel...");
      if (typeof XLSX === "undefined") return;
      const data = visibleBookings().map(b => ({
        "Booking ID": b.id,
        "Client": b.client,
        "Supplier / DMC": b.dmcName || b.supplier || "Supplier",
        "Cost (Net)": b.cost,
        "Ops Approved": b.opsApproved ? "Approved" : "Pending",
        "Paid": b.supplierPaid ? "Yes" : "No",
        "Payment UTR": b.utr || "—"
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "SupplierPayments");
      XLSX.writeFile(wb, `Romford_SupplierPayments_${localDate()}.xlsx`);
    }

    /* ========================================================
       CROSS-SESSION SYNC
       When any role (sales / ops / accounts / admin) changes money
       data (payments, approvals, verification) in another tab or
       session, reload and refresh so every page stays consistent.
       ======================================================== */
    window.addEventListener('storage', function(e) {
      if (!currentUsername) return;
      if ((e.key === USERS_KEY || e.key === LOGIN_REQUESTS_KEY || e.key === null) && !signedInUser()) { __bookingDirty=false; handleLogout(); return; }
      if (e.key === USERS_KEY || e.key === DB_KEY) {
        if (!isFormView()) {
          refreshFromStorage();
          rerenderCurrentView();
          showToast('Data synced from another session');
        }
      }
    });

    // Track unsaved edits in the booking detail form (for Back-to-List warning popup).
    ['input', 'change'].forEach(function(evt) {
      document.addEventListener(evt, function(e) {
        if (!currentEditingFileId) return;
        const t = e.target;
        if (!t) return;
        const id = t.id || '';
        if (id.indexOf('bf-doc-') === 0) return;
        const isBfField = id.indexOf('bf-') === 0;
        const isPaxName = t.classList && t.classList.contains('bf-pax-name');
        const isPayAmt = (id === 'new-pay-amt');
        if (isBfField || isPaxName || isPayAmt) __bookingDirty = true;
      }, true);
    });

    // Catch up when the user returns to this tab/window.
    window.addEventListener('focus', function() {
      if (currentUsername && document.getElementById('app-shell') && document.getElementById('app-shell').style.display !== 'none') {
        if (!signedInUser()) { __bookingDirty=false; handleLogout(); return; }
        if (!isFormView()) { refreshFromStorage(); rerenderCurrentView(); }
      }
    });
  </script>

  <!-- UNSAVED CHANGES POPUP (shown on Back to List when there are unsaved edits) -->
  <div id="discard-save-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:300; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:14px; max-width:430px; width:90%; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.30);">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <div style="width:44px; height:44px; border-radius:10px; background:#FEF3C7; color:#D97706; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;">⚠️</div>
        <b style="font-size:16px; color:#1E293B;">Unsaved Changes</b>
      </div>
      <p style="font-size:13.5px; color:#475569; margin:0 0 22px; line-height:1.5;">You have unsaved changes in this booking file. Do you want to <b>save</b> them before going back to the list, or <b>discard</b> them?</p>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" class="btn btn-outline" style="padding:10px 18px; font-weight:600;" onclick="confirmDiscardBack()">Discard</button>
        <button type="button" class="btn btn-success" style="padding:10px 18px; font-weight:600;" onclick="confirmSaveBack()">💾 Save &amp; Back</button>
      </div>
    </div>
  </div>
